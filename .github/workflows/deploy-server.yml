name: Deploy to Production Server

on:
  # Deploys are driven by the nostr deploy watcher on the VPS, which pulls this
  # repository's canonical copy from grasp.day.ag and runs the same deploy
  # script this workflow runs. Keeping the push trigger as well deployed every
  # publish twice, from two paths. Manual dispatch stays as a fallback, but the
  # self-hosted runner is stopped, so start that service again to use it.
  workflow_dispatch:

concurrency:
  group: deploy-blockstr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, blockstr]
    timeout-minutes: 10
    steps:
      - name: Select the production branch
        run: |
          if ! git -C /home/ubuntu/gamestr/blockstr diff --quiet || ! git -C /home/ubuntu/gamestr/blockstr diff --cached --quiet; then
            git -C /home/ubuntu/gamestr/blockstr stash push --message "auto-stash before switching to master $(date +%Y%m%d-%H%M%S)"
          fi
          git -C /home/ubuntu/gamestr/blockstr fetch origin master
          git -C /home/ubuntu/gamestr/blockstr switch master
      - name: Run deploy script
        run: /home/ubuntu/gamestr/deploy blockstr
