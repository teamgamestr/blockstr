name: Test

# Nostr CI copy of .github/workflows/test.yml, executed by an ngit-ci
# coordinator through act. It lives in .ngit/act/workflows/ so the GitHub
# mirror keeps running its own file unchanged: workflows under .github/ are
# detected by the coordinator but never executed.
#
# Differences from the GitHub copy:
#   - targets `master`, which is the repository's actual default branch (the
#     GitHub copy filters on `main` and so has never fired on a push)
#   - no `cache: npm` on setup-node: the act runtime provides no GITHUB_TOKEN,
#     and the action's cache API needs one.
#   - installs with `npm ci` from the committed lockfile. The step this replaced
#     deleted package-lock.json and ran `npm install`, so every run resolved the
#     newest matching dependency - which is how a nostr-tools release silently
#     broke the build (its makeZapRequest signature changed under us). A
#     dependency bump is now a reviewed commit, not a surprise.
#
#   - runs the gates as separate steps (typecheck, lint, unit tests, build)
#     rather than one `npm run test`, so a failure says which gate failed and
#     the steps after it still report.
#
# Runtime notes: jobs run in act's catthehacker/ubuntu images, Linux only, and
# actions/checkout is required because the coordinator copies the workspace
# through the Docker API.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies from the committed lockfile
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint
        run: npx eslint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build
